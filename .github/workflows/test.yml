name: run unit tests
on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - 'develop'
  #    - 'main'
  pull_request:
    types: [opened, reopened]
    branches:
      - 'develop'
      - 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"

      - name: Checkout test_gps_teseo
        uses: actions/checkout@v4
        with:
          path: test_gps_teseo
          submodules: false
          repository: jancumps/test_gps_teseo

      - name: Checkout pico_gps_teseo
        uses: actions/checkout@v4
        with:
          path: test_gps_teseo/pico_gps_teseo
          submodules: true
          
      - name: Checkout pico-sdk/develop
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: develop
          path: test_gps_teseo/pico-sdk

      - name: Checkout pico-sdk submodules
        working-directory: ${{github.workspace}}/test_gps_teseo/pico-sdk
        run: git submodule update --init

      - name: Install dependencies
        run: |
          sudo apt-get install ninja-build

          sudo apt-get install cmake
          sudo add-apt-repository universe
          sudo apt update
          
          # sudo apt install gcc-15
          echo install gcc 15
          sudo apt install -y build-essential git make gawk flex bison libgmp-dev libmpfr-dev libmpc-dev python3 binutils perl libisl-dev libzstd-dev tar gzip bzip2
          export CONFIG_SHELL=/bin/bash
          mkdir ~/gcc-15
          cd ~/gcc-15
          git clone https://gcc.gnu.org/git/gcc.git gcc-15-source
          cd gcc-15-source
          git checkout releases/gcc-15.2.0
          ./contrib/download_prerequisites
          cd ~/gcc-15
          mkdir gcc-15-build
          cd gcc-15-build
          ../gcc-15-source/configure --prefix=/opt/gcc-15 --disable-multilib --enable-languages=c,c++
          make -j$(nproc)
          sudo make install
          sudo update-alternatives --install /usr/bin/gcc gcc /opt/gcc-15/bin/gcc 100
          sudo update-alternatives --install /usr/bin/g++ g++ /opt/gcc-15/bin/g++ 100

          gcc --version
          whereis gcc
          whereis gcc-15
          ls -la /usr/bin | grep g++

          # install gcc cross-compile for ARM v 14.3.1
          curl -Lo gcc-arm-none-eabi.tar.xz "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz"
          sudo mkdir /opt/gcc-arm-none-eabi
          sudo tar xf gcc-arm-none-eabi.tar.xz --strip-components=1 -C /opt/gcc-arm-none-eabi
          echo 'export PATH=$PATH:/opt/gcc-arm-none-eabi/bin' | sudo tee -a /etc/profile.d/gcc-arm-none-eabi.sh
          export PATH=$PATH:/opt/gcc-arm-none-eabi/bin
          export PICO_TOOLCHAIN_PATH=/opt/gcc-arm-none-eabi/bin
          source /etc/profile
          ls -lrta /opt/gcc-arm-none-eabi/bin
          arm-none-eabi-c++ --version             

      - name: Fetch pico_gps_teseo libs
        working-directory: ${{github.workspace}}/test_gps_teseo/pico_gps_teseo
        shell: bash
        run: |
          echo ${{ github.ref }}
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE -DCMAKE_C_COMPILER:FILEPATH=/opt/gcc-arm-none-eabi/bin/arm-none-eabi-gcc -DCMAKE_CXX_COMPILER:FILEPATH=/opt/gcc-arm-none-eabi/bin/arm-none-eabi-g++ -DPICO_TOOLCHAIN_PATH=/opt/gcc-arm-none-eabi/bin -DPICO_SDK_PATH=../../pico-sdk -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico
          cmake --build .
          cd ..
          ls -lrt build/*.uf2

      - name: Build Project
        working-directory: ${{github.workspace}}/test_gps_teseo
        shell: bash
        run: |
          echo ${{ github.ref }}
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE -DCMAKE_C_COMPILER:FILEPATH=/opt/gcc-15/bin/gcc -DCMAKE_CXX_COMPILER:FILEPATH=/opt/gcc-15/bin/g++ -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          cd ..

      - name: Test Project
        working-directory: ${{github.workspace}}/test_gps_teseo
        shell: bash
        run: |
          cd build
          ctest
          # chmod +x ./test_class_module
          # ./test_class_module
          cd ..
