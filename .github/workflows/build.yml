name: Build on ubuntu against pico-sdk develop
on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - 'develop'
  #    - 'main'
  pull_request:
    types: [opened, reopened]
    branches:
      - 'develop'
      - 'main'

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"

      - name: Checkout pico_gps_teseo
        uses: actions/checkout@v7
        with:
          path: pico_gps_teseo

      - name: Checkout pico-sdk/develop
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: develop
          path: pico-sdk

      - name: Checkout pico-sdk submodules
        working-directory: ${{github.workspace}}/pico-sdk
        run: git submodule update --init

      - name: Install dependencies
        run: |
          sudo apt-get install ninja-build

          sudo apt-get install cmake

          # # install gcc cross-compile for ARM v 15.3
          # curl -Lo gcc-arm-none-eabi.tar.xz "https://gitlab.arm.com/tooling/gnu-toolchains-for-arm/-/package_files/13789/download"
          # sudo mkdir /opt/gcc-arm-none-eabi
          # sudo tar xf gcc-arm-none-eabi.tar.xz --strip-components=1 -C /opt/gcc-arm-none-eabi
          # echo 'export PATH=$PATH:/opt/gcc-arm-none-eabi/bin' | sudo tee -a /etc/profile.d/gcc-arm-none-eabi.sh
          # export PATH=$PATH:/opt/gcc-arm-none-eabi/bin
          # export PICO_TOOLCHAIN_PATH=/opt/gcc-arm-none-eabi/bin
          # source /etc/profile
          # ls -lrta /opt/gcc-arm-none-eabi/bin
          # arm-none-eabi-c++ --version
          # export _C_COMPILER=/opt/gcc-arm-none-eabi/bin/arm-none-eabi-gcc
          # export _CXX_COMPILER=/opt/gcc-arm-none-eabi/bin/arm-none-eabi-g++


          # install gcc cross-compile for RISC-V v 15
          curl -Lo riscv32-unknown-elf.tar.xz https://github.com/raspberrypi/pico-sdk-tools/releases/download/v2.3.0-0/riscv-toolchain-15-x86_64-lin.tar.gz
          sudo mkdir /opt/riscv32-unknown-elf
          sudo tar xf riscv32-unknown-elf.tar.xz --strip-components=1 -C /opt/riscv32-unknown-elf
          echo 'export PATH=$PATH:/opt/riscv32-unknown-elf' | sudo tee -a /etc/profile.d/riscv32-unknown-elf.sh
          export PATH=$PATH:/opt/riscv32-unknown-elf
          export PICO_TOOLCHAIN_PATH=/opt/riscv32-unknown-elf
          source /etc/profile
          ls -lrta /opt/riscv32-unknown-elf
          riscv32-unknown-elf-c++ --version
          export _C_COMPILER=/opt/riscv32-unknown-elf/riscv32-unknown-elf-gcc
          export _CXX_COMPILER=/opt/riscv32-unknown-elf/riscv32-unknown-elf-g++

          #install picotool
          curl -Lo picotool-2.3.0-x86_64-lin.tar.gz "https://github.com/raspberrypi/pico-sdk-tools/releases/download/v2.3.0-0/picotool-2.3.0-x86_64-lin.tar.gz"
          sudo mkdir /opt/picotool
          sudo tar -xvzf picotool-2.3.0-x86_64-lin.tar.gz --strip-components=1 -C /opt/picotool
          sudo chmod +x /opt/picotool/picotool
          ls -lrta /opt/picotool
          ls -lrta /opt/picotool/picotool
          echo 'export PATH=$PATH:/opt/picotool' | sudo tee -a /etc/profile.d/picotool.sh
          export PATH=$PATH:/opt/picotool
          source /etc/profile

      - name: Build Project
        working-directory: ${{github.workspace}}/pico_gps_teseo
        # bash required otherwise this mysteriously (no error) fails at "Generating cyw43_bus_pio_spi.pio.h"
        shell: bash
        run: |
          echo ${{ github.ref }}
          mkdir build
          cd build
          export PICO_BOARD=pico 
          export PICO_PLATFORM=rp2040
          export PICOTOOL_DIR=/opt/picotool
          export PICO_TOOLCHAIN_PATH=/opt/gcc-arm-none-eabi/bin
          cmake .. -G "Ninja" -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE -DCMAKE_C_COMPILER:FILEPATH=$_C_COMPILER -DCMAKE_CXX_COMPILER:FILEPATH=_XX_COMPILER -DPICO_SDK_PATH=../../pico-sdk -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          cd ..
          ls -lrt build/*.uf2

