name: Build on ubuntu against pico-sdk develop
on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - 'develop'
  #    - 'main'
  pull_request:
    types: [opened, reopened]
    branches:
      - 'develop'
      - 'main'

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"

      - name: Checkout pico_gps_teseo
        uses: actions/checkout@v7
        with:
          path: pico_gps_teseo

      - name: Checkout pico-sdk/develop
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: develop
          path: pico-sdk

      - name: Checkout pico-sdk submodules
        working-directory: ${{github.workspace}}/pico-sdk
        run: git submodule update --init

      - name: Install dependencies
        run: |
          sudo apt-get install ninja-build

          sudo apt-get install cmake

          sudo apt install gcc-arm-none-eabi

          #install picotool
          curl -Lo picotool-2.3.0-x86_64-lin.tar.gz "https://github.com/raspberrypi/pico-sdk-tools/releases/download/v2.3.0-0/picotool-2.3.0-x86_64-lin.tar.gz"
          sudo mkdir /opt/picotool
          sudo tar -xvzf picotool-2.3.0-x86_64-lin.tar.gz --strip-components=1 -C /opt/picotool
          sudo chmod +x /opt/picotool/picotool
          ls -lrta /opt/picotool
          ls -lrta /opt/picotool/picotool
          echo 'export PATH=$PATH:/opt/picotool' | sudo tee -a /etc/profile.d/picotool.sh
          export PATH=$PATH:/opt/picotool
          source /etc/profile

      - name: Build Project
        working-directory: ${{github.workspace}}/pico_gps_teseo
        # bash required otherwise this mysteriously (no error) fails at "Generating cyw43_bus_pio_spi.pio.h"
        shell: bash
        run: |
          echo ${{ github.ref }}
          mkdir build
          cd build
          export PICO_BOARD=pico 
          export PICO_PLATFORM=rp2040
          export PICOTOOL_DIR=/opt/picotool
          export PICO_TOOLCHAIN_PATH=/usr/bin
          cmake .. -G "Ninja" -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE -DCMAKE_C_COMPILER:FILEPATH=/usr/bin/arm-none-eabi-gcc -DCMAKE_CXX_COMPILER:FILEPATH=/usr/bin/arm-none-eabi-g++ -DPICO_SDK_PATH=../../pico-sdk -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          cd ..
          ls -lrt build/*.uf2

